<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>РЭУ Игры</title>
<link rel="manifest" href="/games/manifest.webmanifest">
<link rel="icon" href="/games/icon-192.png">
<link rel="apple-touch-icon" href="/games/icon-192.png">
<style>
:root{--bg:#0b0d16;--card:#181c2b;--accent:#8b7bff;--red:#ff5d6c;--green:#4ade80;--text:#eef0f8;--muted:#8d94ad;--line:#2a3045;--amber:#f5b942;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none !important}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
/* отступы учитывают вырезы телефона и кнопки Telegram в полноэкранном режиме */
body{padding:calc(max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)) + 16px) calc(env(safe-area-inset-left,0px) + 16px)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 20% 15%,rgba(139,123,255,.35),transparent 70%),radial-gradient(40% 40% at 85% 80%,rgba(56,168,245,.22),transparent 70%);animation:drift 14s ease-in-out infinite alternate}
button,a.btn{font:inherit;color:var(--text);cursor:pointer}
.btn{display:inline-block;border:0;border-radius:14px;background:var(--card);font-weight:700;padding:12px 18px;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.94)}
.btn.main{background:var(--accent);color:#fff}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* вход */
#gate{max-width:380px;margin:0 auto;min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
#gate img{width:96px;height:96px;border-radius:24px}
#gate p{color:var(--muted);line-height:1.5}

/* библиотека */
#home{display:flex;flex-direction:column;min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px)}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{flex:1;font-size:clamp(22px,3.4vw,40px);letter-spacing:.5px}
#clock{font-size:clamp(18px,2.4vw,28px);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
h2.sec{font-size:clamp(14px,1.6vw,20px);color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin:auto 0 14px}
#lib{display:flex;gap:20px;overflow-x:auto;padding:10px 6px 22px;margin-bottom:auto;scroll-snap-type:x mandatory}
.game{flex:none;width:min(78vw,52vh,440px);aspect-ratio:3/4;border:0;border-radius:26px;background:var(--card);padding:0;overflow:hidden;position:relative;scroll-snap-align:center;transition:transform .22s cubic-bezier(.2,1.4,.4,1),box-shadow .22s;animation:rise .5s backwards}
.game:hover,.game:focus-visible{transform:translateY(-8px) scale(1.03);box-shadow:0 20px 50px rgba(139,123,255,.45)}
.game .art{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:7px;padding:30px 30px 110px;background:linear-gradient(160deg,#2b2459,#101327);transform:rotate(-8deg) scale(1.12)}
.game .art i{border-radius:10px;background:var(--k);box-shadow:inset 0 4px 0 rgba(255,255,255,.35),inset 0 -5px 0 rgba(0,0,0,.25);animation:float 3.6s ease-in-out infinite}
.game .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 20px 18px;text-align:left;background:linear-gradient(transparent,rgba(5,6,12,.94) 45%)}
.game .cap b{display:block;font-size:clamp(24px,3vw,34px)}
.game .cap span{display:block;color:var(--muted);margin:2px 0 12px}
.game .cap em{display:inline-block;font-style:normal;font-weight:800;background:var(--green);color:#06210f;border-radius:12px;padding:9px 22px}
.game.soon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);border:3px dashed var(--line);background:transparent;font-size:20px;font-weight:700}
.game.soon u{text-decoration:none;font-size:60px;line-height:1}
#hint{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;padding-top:8px}
kbd{font:inherit;font-weight:700;color:var(--text);background:var(--card);border-radius:6px;padding:1px 7px}
@media (pointer:coarse){#hint{display:none}}
@media (max-width:520px){header h1{flex-basis:100%}#clock{margin-right:auto}}

/* игра */
#play{margin:0 auto;width:100%}
#blocks{margin:0 auto}
#blocks h1{font-size:22px}
#keys{color:var(--muted);font-size:13px;text-align:center;margin-top:12px;line-height:2}
@media (pointer:coarse){#keys{display:none}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border-radius:14px;padding:12px 18px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);width:max-content;max-width:90vw;text-align:center}
@keyframes drift{to{transform:translate(4%,3%) scale(1.08)}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
@keyframes float{50%{transform:translateY(-6px)}}
/* заставка входа в игровой режим */
#intro{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;overflow:hidden;background:#05060c;cursor:pointer;animation:in-out .55s 2.65s ease-in forwards}
#intro .glow{position:absolute;width:140vmax;height:140vmax;left:50%;top:50%;margin:-70vmax 0 0 -70vmax;background:radial-gradient(circle,rgba(139,123,255,.55),rgba(56,168,245,.18) 25%,transparent 55%);animation:in-glow 2.6s ease-out backwards}
#intro .ring{position:absolute;left:50%;top:50%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border:2px solid rgba(190,180,255,.8);border-radius:50%;opacity:0;animation:in-ring 1.5s 1s ease-out}
#intro .ring+.ring{animation-delay:1.25s;border-color:rgba(100,200,255,.7)}
#intro .streak{position:absolute;left:-60%;width:60%;height:2px;background:linear-gradient(90deg,transparent,#bcd9ff,transparent);animation:in-streak .9s ease-in forwards;opacity:.8}
#intro .logo{position:relative;display:grid;grid-template-columns:repeat(3,clamp(34px,9vmin,86px));grid-auto-rows:clamp(34px,9vmin,86px);gap:8px;animation:in-thump .5s 1s ease-out}
#intro .logo i{border-radius:22%;background:var(--k);box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.25),0 0 34px var(--k);animation:in-fly .8s cubic-bezier(.2,1.25,.35,1) backwards}
#intro .name{position:relative;font-size:clamp(28px,7vmin,68px);font-weight:900;white-space:nowrap;animation:in-name .9s 1.15s cubic-bezier(.2,.8,.2,1) backwards}
#intro .sub{position:relative;margin-top:-16px;color:var(--muted);font-size:clamp(12px,2.2vmin,20px);letter-spacing:.35em;text-transform:uppercase;animation:in-sub .7s 1.6s backwards}
#intro .skip{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);color:var(--muted);font-size:13px;opacity:.6;animation:in-sub .5s 1.2s backwards}
body.intro #lib .game,body.intro header,body.intro h2.sec{animation-play-state:paused}
header,h2.sec{animation:rise .5s backwards}
@keyframes in-out{to{opacity:0;transform:scale(1.35);visibility:hidden}}
@keyframes in-glow{from{opacity:0;transform:scale(.2)}45%{opacity:.5}}
@keyframes in-ring{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(4)}}
@keyframes in-streak{to{transform:translateX(280vw)}}
@keyframes in-fly{from{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(2.2)}}
@keyframes in-thump{35%{transform:scale(1.18);filter:brightness(1.7)}}
@keyframes in-name{from{opacity:0;letter-spacing:.5em;filter:blur(14px)}}
@keyframes in-sub{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){#intro{display:none}}
@media (prefers-reduced-motion:reduce){*,body::before{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div id="intro" hidden aria-hidden="true"></div>

<div id="gate" hidden>
  <img src="/games/icon-192.png" alt="">
  <h1>РЭУ Игры</h1>
  <p id="gate-text">Проверяю вход…</p>
  <button id="login" class="btn main" hidden>Войти через бота</button>
  <a id="botlink" class="btn main" target="_blank" rel="noopener" hidden>Открыть Telegram</a>
  <button id="retry" class="btn" hidden>Повторить</button>
  <button id="other" class="btn" hidden>Выйти</button>
</div>

<div id="home" hidden>
  <header>
    <h1>РЭУ Игры</h1>
    <span id="clock"></span>
    <button id="mode" class="btn main">⛶ Игровой режим</button>
    <button id="logout" class="btn">Выйти</button>
  </header>
  <h2 class="sec">Доступные игры</h2>
  <div id="lib"></div>
  <div id="hint"><span><kbd>←</kbd> <kbd>→</kbd> выбор</span><span><kbd>Enter</kbd> запуск</span><span><kbd>F</kbd> весь экран</span></div>
</div>

<div id="play" hidden>
  <div id="blocks"></div>
  <div id="keys"><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> фигура · <kbd>←↑↓→</kbd> двигать · <kbd>Enter</kbd> поставить · <kbd>S</kbd> сменить · <kbd>R</kbd> заново · <kbd>Backspace</kbd> назад · <kbd>F</kbd> весь экран</div>
</div>

<div id="toast" hidden></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const SESSION = "rey-games-session", PENDING = "rey-games-login", OK = "rey-games-admin";
const mem = {}; // если хранилище недоступно, вход живёт до закрытия страницы
const get = (k) => { try { return localStorage.getItem(k) ?? mem[k] ?? null; } catch { return mem[k] ?? null; } };
const set = (k, v) => {
  if (v == null) delete mem[k]; else mem[k] = v;
  try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {}
};
// внутри Android-приложения кабинета вход уже есть
const appSession = () => { try { return window.ReyApp?.session?.() || ""; } catch { return ""; } };

/* ---------- запуск как мини-приложение Telegram (t.me/<бот>/games) ---------- */
let tg = null;
// скрипт Telegram грузим только внутри Telegram: обычному браузеру и офлайн-запуску он не нужен
function loadTelegram() {
  if (!/tgWebApp/.test(location.hash)) return Promise.resolve();
  return new Promise((done) => {
    const s = document.createElement("script");
    s.src = "https://telegram.org/js/telegram-web-app.js";
    s.onload = s.onerror = () => { clearTimeout(timer); done(); };
    const timer = setTimeout(done, 8000);
    document.head.append(s);
  }).then(() => {
    const w = window.Telegram?.WebApp;
    if (!w?.initData) return;
    tg = w;
    const safe = (f) => { try { f(); } catch {} };
    safe(() => tg.ready());
    safe(() => tg.expand());
    safe(() => tg.disableVerticalSwipes()); // чтобы перетаскивание фигур не сворачивало окно
    safe(() => tg.setHeaderColor("#0b0d16"));
    safe(() => tg.setBackgroundColor("#0b0d16"));
    safe(() => tg.BackButton.onClick(() => { if (current && !current.api().back()) library(); }));
    safe(() => tg.onEvent("fullscreenChanged", () => { modeLabel(); setTimeout(() => dispatchEvent(new Event("resize")), 100); }));
  });
}

/* ---------- каталог игр: новую игру достаточно добавить сюда ---------- */
const GAMES = [
  { title: "Блоки", desc: "60 уровней · головоломка", src: "/cabinet/blocks.js", api: () => window.ReyBlocks, root: "#blocks" },
];

function view(id) {
  for (const v of ["gate", "home", "play"]) $("#" + v).hidden = v !== id;
  try { id === "play" ? tg?.BackButton.show() : tg?.BackButton.hide(); } catch {}
  window.scrollTo(0, 0);
}
let toastTimer = 0;
function toast(text) {
  $("#toast").textContent = text; $("#toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => ($("#toast").hidden = true), 4000);
}

/* ---------- вход (только админ) ---------- */
function gate(text, buttons = []) {
  view("gate");
  $("#gate-text").textContent = text;
  for (const id of ["login", "botlink", "retry", "other"]) $("#" + id).hidden = !buttons.includes(id);
}
async function post(fn, body) {
  const r = await fetch("/.netlify/functions/" + fn, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Ошибка " + r.status), { status: r.status, relogin: j.relogin });
  return j;
}
function forget() { set(SESSION, null); set(OK, null); set(PENDING, null); }
async function check() {
  const initData = tg?.initData || "";
  const session = initData ? "" : appSession() || get(SESSION);
  if (!initData && !session) return get(PENDING) ? wait() : gate("Игровой раздел пока открыт только админу. Войдите через Telegram-бота.", ["login"]);
  gate("Проверяю вход…");
  try {
    const info = await post("cabinet", { action: "info", initData, session });
    if (!info.isAdmin) {
      set(OK, null);
      return gate("Игры пока доступны только админу.", initData || appSession() ? [] : ["other"]);
    }
    set(OK, "1");
    library();
  } catch (e) {
    if (initData && e.status === 401) return gate("Закройте окно и откройте игры из Telegram заново.");
    if (e.relogin) { forget(); return gate("Вход устарел, войдите заново.", ["login"]); }
    // нет связи или сервер болен: пускаем, если раньше вход уже был подтверждён
    if ((!e.status || e.status >= 500) && get(OK)) { library(); return toast("Нет связи, играем без сети"); }
    gate(e.status ? e.message : "Нет связи с сервером.", ["retry", ...(initData || appSession() ? [] : ["other"])]);
  }
}
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
async function login() {
  $("#login").disabled = true;
  try {
    const secret = hex(crypto.getRandomValues(new Uint8Array(32)));
    const h = hex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(secret)));
    const r = await post("appauth", { action: "init", h });
    set(PENDING, JSON.stringify({ code: r.code, secret, link: r.link, exp: Date.now() + r.ttl * 1000 }));
    wait();
  } catch (e) { toast(e.message || "Не получилось начать вход"); }
  $("#login").disabled = false;
}
let pollTimer = 0;
function wait() {
  clearTimeout(pollTimer);
  let p = null;
  try { p = JSON.parse(get(PENDING)); } catch {}
  if (!p || Date.now() > p.exp) { set(PENDING, null); return gate("Время на вход вышло, попробуйте ещё раз.", ["login"]); }
  $("#botlink").href = p.link;
  gate("Откройте бота, нажмите «Старт», затем «Подтвердить вход». После этого вернитесь сюда.", ["botlink", "other"]);
  const poll = async () => {
    if (get(PENDING) == null) return;
    try {
      const r = await post("appauth", { action: "poll", code: p.code, secret: p.secret });
      if (get(PENDING) == null) return;
      if (r.status === "ok") { set(PENDING, null); set(SESSION, r.token); return check(); }
      if (r.status === "denied" || r.status === "expired") {
        set(PENDING, null);
        return gate(r.status === "expired" ? "Время на вход вышло, попробуйте ещё раз." : r.reason === "not_member" ? "Вход только для участников группы." : "Вход отменён.", ["login"]);
      }
    } catch {}
    if (Date.now() > p.exp) return wait();
    pollTimer = setTimeout(poll, 2000);
  };
  pollTimer = setTimeout(poll, 2000);
}
$("#login").onclick = login;
$("#retry").onclick = check;
$("#other").onclick = $("#logout").onclick = () => {
  clearTimeout(pollTimer); forget();
  gate("Игровой раздел пока открыт только админу. Войдите через Telegram-бота.", ["login"]);
};

/* ---------- библиотека ---------- */
let current = null, last = 0;
const COLORS = ["#ff5d6c", "#ff9f43", "#f5c542", "#35c97a", "#38a8f5", "#9b7bff"];
function card(game, i) {
  const b = document.createElement("button");
  b.className = "game"; b.type = "button";
  const art = document.createElement("div"); art.className = "art";
  const picture = "..00. .00.4 33.44 3.554 22251 .2111".replace(/ /g, "");
  [...picture].forEach((ch, k) => {
    const t = document.createElement("i");
    if (ch === ".") t.style.visibility = "hidden";
    else { t.style.setProperty("--k", COLORS[ch]); t.style.animationDelay = (k % 7) * -0.5 + "s"; }
    art.append(t);
  });
  const cap = document.createElement("div"); cap.className = "cap";
  for (const [tag, text] of [["b", game.title], ["span", game.desc], ["em", "▶ Играть"]]) {
    const e = document.createElement(tag); e.textContent = text; cap.append(e);
  }
  b.append(art, cap);
  b.onclick = () => { last = i; launch(game); };
  return b;
}
function library() {
  if (current) { current.api().close(); current = null; }
  view("home");
  const soon = document.createElement("div");
  soon.className = "game soon";
  soon.innerHTML = "<u>+</u>Скоро новые игры";
  $("#lib").replaceChildren(...GAMES.map(card), soon);
  $("#lib").children[last]?.focus({ preventScroll: true });
}
const scripts = {};
async function launch(game) {
  try {
    await (scripts[game.src] ||= new Promise((ok, no) => {
      const s = document.createElement("script");
      s.src = game.src; s.onload = ok;
      s.onerror = () => { delete scripts[game.src]; s.remove(); no(new Error("Не удалось загрузить игру")); };
      document.head.append(s);
    }));
    if ($("#home").hidden) return;
    fullscreen(true);
    current = game;
    view("play");
    game.api().open($(game.root), library);
  } catch (e) { toast(e.message); }
}

/* ---------- заставка: блоки слетаются в значок, вспышка, название ---------- */
let introTimer = 0, audio = null;
function introSound() {
  try {
    if (JSON.parse(get("rey-blocks") || "{}").mute) return;
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    audio.resume?.().catch(() => {});
    if (audio.state !== "running") return; // до первого касания браузер звук не разрешает
    const note = (f, at, len, type, vol, to) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + at;
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + len);
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, t + len);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + len);
    };
    note(55, 0, 1.2, "sawtooth", 0.05, 220); // нарастание
    [262, 392, 523, 659, 784].forEach((f, i) => note(f, 1 + i * 0.05, 1.7, "triangle", 0.07)); // аккорд
  } catch {}
}
function endIntro() {
  clearTimeout(introTimer);
  audio?.suspend?.().catch(() => {});
  $("#intro").hidden = true;
  $("#intro").replaceChildren();
  document.body.classList.remove("intro");
}
function intro() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  endIntro();
  const box = $("#intro");
  const add = (parent, cls, tag = "div", text = "") => {
    const e = document.createElement(tag); e.className = cls; e.textContent = text; parent.append(e); return e;
  };
  add(box, "glow"); add(box, "ring"); add(box, "ring");
  for (let i = 0; i < 7; i++) {
    const s = add(box, "streak");
    s.style.top = 8 + i * 13 + "%"; s.style.animationDelay = ((i * 5) % 7) * 0.09 + "s";
  }
  const logo = add(box, "logo");
  // клетки значка: [столбец, строка, цвет, откуда прилетает]
  [[1, 1, 1, "-60vw", "-30vh"], [2, 1, 5, "10vw", "-60vh"], [2, 2, 4, "-20vw", "60vh"], [3, 2, 3, "60vw", "25vh"], [3, 3, 0, "40vw", "50vh"], [1, 3, 2, "-55vw", "35vh"]]
    .forEach(([c, r, k, x, y], i) => {
      const t = add(logo, "", "i");
      t.style.cssText = `grid-column:${c};grid-row:${r};--k:${COLORS[k]};--x:${x};--y:${y};--r:${i % 2 ? 220 : -220}deg;animation-delay:${0.15 + i * 0.09}s`;
    });
  add(box, "name", "div", "РЭУ Игры");
  add(box, "sub", "div", "игровой режим");
  add(box, "skip", "div", "нажмите, чтобы пропустить");
  box.hidden = false;
  document.body.classList.add("intro");
  introSound();
  introTimer = setTimeout(endIntro, 3200);
  // библиотека начинает выезжать, пока заставка растворяется
  setTimeout(() => { if (!box.hidden) document.body.classList.remove("intro"); }, 2650);
}
$("#intro").onclick = endIntro;
// любая клавиша пропускает заставку и не срабатывает в меню под ней
window.addEventListener("keydown", (e) => {
  if ($("#intro").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault(); e.stopImmediatePropagation();
  endIntro();
}, true);

/* ---------- игровой режим: весь экран и экран не гаснет ---------- */
const isFull = () => tg ? !!tg.isFullscreen : !!(document.fullscreenElement || document.webkitFullscreenElement);
let wake = null;
async function keepAwake() {
  try { if (!wake || wake.released) wake = await navigator.wakeLock?.request("screen"); } catch {}
}
function fullscreen(on) {
  keepAwake();
  const d = document, root = d.documentElement;
  if (tg) { // внутри Telegram весь экран включает он сам (Bot API 8.0+)
    try { if (canFull() && on !== isFull()) on ? tg.requestFullscreen() : tg.exitFullscreen(); } catch {}
    return;
  }
  try {
    if (on && !isFull()) (root.requestFullscreen || root.webkitRequestFullscreen)?.call(root)?.catch?.(() => {});
    if (!on && isFull()) (d.exitFullscreen || d.webkitExitFullscreen).call(d)?.catch?.(() => {});
  } catch {}
}
const canFull = () => tg ? !!tg.isVersionAtLeast?.("8.0") : !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
const modeLabel = () => ($("#mode").textContent = isFull() ? "✕ Выйти из режима" : "⛶ Игровой режим");
function toggleMode() {
  const on = !isFull();
  fullscreen(on);
  if (on && !$("#home").hidden) intro();
}
$("#mode").onclick = toggleMode;
for (const ev of ["fullscreenchange", "webkitfullscreenchange"])
  document.addEventListener(ev, modeLabel);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#play").hidden) keepAwake(); });

/* ---------- клавиатура (внутри игры клавиши обрабатывает сама игра) ---------- */
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "KeyF" && !e.repeat) { e.preventDefault(); return $("#home").hidden ? fullscreen(!isFull()) : toggleMode(); }
  if ($("#home").hidden) return;
  const dir = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: "top", ArrowDown: "cards" }[e.code];
  if (!dir) return;
  e.preventDefault();
  const cards = [...document.querySelectorAll("#lib button")], top = [...document.querySelectorAll("header button:not([hidden])")];
  const inTop = top.includes(document.activeElement);
  if (dir === "top") return top[0]?.focus();
  if (dir === "cards") return cards[Math.min(last, cards.length - 1)]?.focus();
  const list = inTop ? top : cards, i = list.indexOf(document.activeElement);
  const next = list[i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + dir))];
  next?.focus(); next?.scrollIntoView({ block: "nearest", inline: "center" });
});

const tick = () => ($("#clock").textContent = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }));
tick(); setInterval(tick, 10000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/games/sw.js").catch(() => {});
gate("Проверяю вход…");
intro();
loadTelegram().then(() => {
  $("#logout").hidden = !!(tg || appSession());
  $("#mode").hidden = !canFull();
  modeLabel();
  check();
});
</script>
</body>
</html>
