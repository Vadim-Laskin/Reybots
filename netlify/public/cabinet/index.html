<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e1014;--card:#1a1d26;--accent:#8b7bff;--red:#ff5d6c;--green:#4ade80;--text:#eceef5;--muted:#8b90a0;--line:#2a2e3a}
*{box-sizing:border-box;margin:0}
[hidden]{display:none !important}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
h1{font-size:26px}
.i{display:inline-flex;width:1.2em;height:1.2em;flex:none}
.i svg{width:100%;height:100%}
@keyframes spin{to{transform:rotate(360deg)}}
.spin svg{animation:spin 1s linear infinite}
.hi{color:var(--muted);margin:4px 0 20px}
.menu{display:grid;gap:12px}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--text);border:0;border-radius:20px;padding:16px;font:inherit}
.item .ic{width:48px;height:48px;flex:none;border-radius:14px;background:rgba(139,123,255,.15);color:var(--accent);display:flex;align-items:center;justify-content:center}
.item .ic .i{width:26px;height:26px}
.item b{display:block;font-size:18px}
.item span{font-size:13px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row b{display:block;font-size:16px}
.row b.ttl{display:flex;align-items:center;gap:8px}
.ttl .i{color:var(--accent)}
.btns{display:flex;gap:8px;flex:none}
.sq{width:42px;height:42px;border-radius:12px;border:0;background:var(--line);color:var(--text);display:flex;align-items:center;justify-content:center}
.sq .i{width:20px;height:20px}
.sq.play{background:var(--accent);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:700;background:var(--accent);color:#fff;margin-top:12px}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--line);color:var(--text)}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);font:inherit;margin-bottom:14px;padding:0}
.muted{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.4}
.h3{font-weight:700;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{aspect-ratio:1;background:var(--card);border:2px solid transparent;border-radius:14px;padding:6px}
.st.sel{border-color:var(--accent)}
.st img{width:100%;height:100%;object-fit:contain}
input[type=text]{width:100%;background:var(--card);border:0;border-radius:12px;padding:12px;color:var(--text);font:inherit;margin-bottom:8px}
input[type=file]{display:none}
.file{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--text)}
#err{display:none;background:#2a1a20;color:var(--red);border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}
#ok{display:none;background:#14251c;color:var(--green);border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:480px;background:var(--card);border-radius:24px 24px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:12px;border:0;background:var(--line);color:var(--text);display:flex;align-items:center;justify-content:center}
.pic{width:200px;height:200px;margin:8px auto 12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pic img{width:100%;height:100%;object-fit:contain}
.pic .i{width:64px;height:64px}
.m-title{font-size:20px;font-weight:700}
.m-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.m-btns .btn{margin-top:0}
</style>
</head>
<body>
<div id="err"></div>
<div id="ok"></div>

<div id="home" class="screen">
  <h1>Личный кабинет</h1>
  <div class="hi" id="hi">Загрузка…</div>
  <div class="menu">
    <button class="item" id="go-schedule"><div class="ic"><span class="i" data-i="calendar"></span></div><div><b>Расписание</b><span>Открыть приложение с расписанием</span></div></button>
    <button class="item" id="go-mine"><div class="ic"><span class="i" data-i="headphones"></span></div><div><b>Мои звуки</b><span>Звуки на стикеры, которые добавил ты</span></div></button>
    <button class="item" id="go-admin" hidden><div class="ic"><span class="i" data-i="shield"></span></div><div><b>Админка</b><span>Все звуки, удаление</span></div></button>
  </div>
</div>

<div id="mine" class="screen" hidden>
  <button class="link" data-back><span class="i" data-i="back"></span>Назад</button>
  <h1>Мои звуки</h1>
  <button class="btn" id="go-add"><span class="i" data-i="plus"></span>Добавить звук</button>
  <div class="h3">Добавленные</div>
  <div id="mine-list"></div>
  <div class="muted">Чужой стикер перезаписать нельзя. Заменить свой звук можно, добавив его заново.</div>
</div>

<div id="add" class="screen" hidden>
  <button class="link" data-back><span class="i" data-i="back"></span>Назад</button>
  <h1>Новый звук</h1>
  <div class="h3">1. Выбери стикер</div>
  <input type="text" id="pack-name" placeholder="Название или ссылка набора">
  <button class="btn ghost" id="pack-find" style="margin-top:0;margin-bottom:12px">Найти</button>
  <div class="grid" id="grid"></div>
  <div class="muted" id="grid-note"></div>

  <div class="h3">2. Выбери аудио</div>
  <label class="file" for="file" id="file-label"><span class="i" data-i="music"></span>Выбрать файл (mp3, m4a, ogg, до 30 сек)</label>
  <input type="file" id="file" accept="audio/*,.mp3,.m4a,.ogg,.oga,.opus,.wav">
  <button class="btn" id="upload" disabled><span class="i" data-i="upload"></span><span id="up-t">Загрузить</span></button>
</div>

<div id="admin" class="screen" hidden>
  <button class="link" data-back><span class="i" data-i="back"></span>Назад</button>
  <h1>Админка</h1>
  <div class="hi">Все звуки. Удалить можно любой.</div>
  <div id="admin-list"></div>
</div>

<div id="modal" hidden>
  <div class="sheet">
    <button class="x" id="modal-x" aria-label="Закрыть"><span class="i" data-i="close"></span></button>
    <div class="pic" id="m-pic"></div>
    <div class="m-title" id="m-title"></div>
    <div class="muted" id="m-sub"></div>
    <div class="m-btns">
      <button class="btn play" id="m-play"><span class="i" data-i="play"></span>Слушать</button>
      <button class="btn ghost" id="m-del"><span class="i" data-i="trash"></span>Удалить</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.("#0e1014");
  tg.setBackgroundColor?.("#0e1014");
  tg.disableVerticalSwipes?.();
  try { if (tg.isVersionAtLeast?.("8.0")) tg.requestFullscreen?.(); } catch {}
}
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

/* ---------- иконки ---------- */
const ICONS = {
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  headphones: '<path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  plus: '<path d="M5 12h14M12 5v14"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>',
  pause: '<rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>',
  trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>',
  back: '<path d="m12 19-7-7 7-7M19 12H5"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  sticker: '<path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v6h6"/><path d="M8 13h.01"/><path d="M16 13h.01"/><path d="M10 16s.8 1 2 1c1.3 0 2-1 2-1"/>',
  close: '<path d="M18 6 6 18M6 6l12 12"/>',
};
const svg = (n) =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const setIcon = (b, n) => {
  const t = b.querySelector(":scope > .i");
  if (t) t.innerHTML = svg(n);
  else b.innerHTML = svg(n);
};
const ico = (n) => { const s = el("span", "i"); setIcon(s, n); return s; };
document.querySelectorAll("[data-i]").forEach((e) => setIcon(e, e.dataset.i));

let INFO = null, ITEMS = [], STICKERS = [], PICK = null, FILE = null;

async function api(action, extra = {}) {
  const r = await fetch("/.netlify/functions/cabinet", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, initData: tg?.initData || "", ...extra }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
  return j;
}
function note(id, text, ms) {
  const box = $(id);
  box.textContent = text;
  box.style.display = "block";
  setTimeout(() => (box.style.display = "none"), ms);
}
const fail = (e) => note("#err", e.message, 5000);
function ask(text, cb) {
  if (tg?.showConfirm) tg.showConfirm(text, (yes) => yes && cb());
  else if (confirm(text)) cb();
}
function setLabel(icon, text) {
  $("#file-label").replaceChildren(ico(icon), document.createTextNode(text));
}

/* ---------- плеер ---------- */
let AUD = null, PLAYING = null;
const URLS = {};
async function audioUrl(id) {
  if (URLS[id]) return URLS[id];
  const j = await api("audio", { id });
  const bin = atob(j.data);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return (URLS[id] = URL.createObjectURL(new Blob([bytes], { type: j.mime })));
}
function stopAudio() {
  if (AUD) { AUD.pause(); AUD = null; }
  PLAYING = null;
  document.querySelectorAll(".play").forEach((b) => {
    b.classList.remove("spin");
    setIcon(b, "play");
  });
}
async function togglePlay(id, btn) {
  if (PLAYING === id) return stopAudio();
  stopAudio();
  setIcon(btn, "loader");
  btn.classList.add("spin");
  try {
    const a = new Audio(await audioUrl(id));
    a.onended = stopAudio;
    AUD = a;
    PLAYING = id;
    await a.play();
    btn.classList.remove("spin");
    setIcon(btn, "pause");
  } catch (e) {
    stopAudio();
    try {
      await api("play", { id });
      note("#ok", "Здесь звук не воспроизводится, отправил его в чат с ботом", 4000);
    } catch (e2) { fail(e2); }
  }
}

/* ---------- навигация ---------- */
function show(id) {
  stopAudio();
  document.querySelectorAll(".screen").forEach((s) => (s.hidden = s.id !== id));
  if (tg) id === "home" ? tg.BackButton.hide() : tg.BackButton.show();
  window.scrollTo(0, 0);
}
function back() {
  if (!$("#modal").hidden) return closeModal();
  const cur = document.querySelector(".screen:not([hidden])")?.id;
  show(cur === "add" ? "mine" : "home");
}

/* ---------- списки звуков ---------- */
function askDelete(it, after) {
  ask("Удалить этот звук?", async () => {
    try {
      await api("delete", { id: it.id });
      if (PLAYING === it.id) stopAudio();
      delete URLS[it.id];
      ITEMS = ITEMS.filter((x) => x.id !== it.id);
      renderLists();
      after?.();
    } catch (e) { fail(e); }
  });
}

function card(it, showOwner) {
  const c = el("div", "card");
  c.onclick = () => openSticker(it);
  const row = el("div", "row");
  const left = el("div");
  const ttl = el("b", "ttl");
  ttl.append(ico("sticker"), el("span", null, it.set || "стикер"));
  left.append(
    ttl,
    el("div", "muted", showOwner ? `Добавил: ${it.ownerName}${it.mine ? " (ты)" : ""}` : it.kind === "audio" ? "Аудиофайл" : "Голосовое")
  );
  const btns = el("div", "btns");
  const play = el("button", "sq play");
  setIcon(play, "play");
  play.onclick = (e) => { e.stopPropagation(); togglePlay(it.id, play); };
  const del = el("button", "sq");
  setIcon(del, "trash");
  del.onclick = (e) => { e.stopPropagation(); askDelete(it); };
  btns.append(play, del);
  row.append(left, btns);
  c.append(row);
  return c;
}
function renderLists() {
  stopAudio();
  const mine = $("#mine-list"), all = $("#admin-list");
  mine.replaceChildren();
  all.replaceChildren();
  const my = ITEMS.filter((i) => i.mine);
  if (!my.length) mine.append(el("div", "muted", "Пока нет ни одного звука."));
  my.forEach((i) => mine.append(card(i, false)));
  if (INFO.isAdmin) {
    if (!ITEMS.length) all.append(el("div", "muted", "Звуков пока нет."));
    ITEMS.forEach((i) => all.append(card(i, true)));
  }
}
async function refresh() {
  ITEMS = (await api("list")).items;
  renderLists();
}

/* ---------- добавление ---------- */
function updateUpload() { $("#upload").disabled = !(PICK && FILE); }

function renderGrid() {
  const g = $("#grid");
  g.replaceChildren();
  STICKERS.forEach((s) => {
    const b = el("button", "st" + (PICK?.uid === s.uid ? " sel" : ""));
    const img = el("img");
    img.loading = "lazy";
    img.alt = "";
    img.src = "/.netlify/functions/sticker-img?f=" + encodeURIComponent(s.thumb);
    b.append(img);
    b.onclick = () => { PICK = s; renderGrid(); updateUpload(); };
    g.append(b);
  });
}
function openAdd() {
  PICK = null; FILE = null; STICKERS = [];
  $("#file").value = "";
  setLabel("music", "Выбрать файл (mp3, m4a, ogg, до 30 сек)");
  $("#pack-name").value = "";
  $("#grid-note").textContent = "Вставь название или ссылку набора стикеров (t.me/addstickers/…) и нажми «Найти».";
  renderGrid();
  updateUpload();
  show("add");
}

$("#pack-find").onclick = async () => {
  try {
    STICKERS = (await api("pack", { name: $("#pack-name").value })).stickers;
    $("#grid-note").textContent = "";
    renderGrid();
  } catch (e) { fail(e); }
};

$("#file").onchange = (ev) => {
  const f = ev.target.files[0];
  FILE = null;
  if (!f) return updateUpload();
  if (f.size > 4 * 1024 * 1024) { fail(new Error("Файл больше 4 МБ")); return updateUpload(); }
  const a = new Audio(URL.createObjectURL(f));
  const accept = () => {
    FILE = f;
    setLabel("check", f.name);
    updateUpload();
  };
  a.onloadedmetadata = () => {
    if (a.duration > 30) { fail(new Error("Длиннее 30 секунд")); $("#file").value = ""; updateUpload(); }
    else accept();
  };
  a.onerror = accept; // формат не читается в браузере, проверит сервер
};

$("#upload").onclick = async () => {
  $("#upload").disabled = true;
  $("#up-t").textContent = "Загружаю…";
  try {
    const audio = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(",")[1]);
      r.onerror = () => rej(new Error("Не удалось прочитать файл"));
      r.readAsDataURL(FILE);
    });
    const r = await api("upload", {
            id: PICK.uid, emoji: PICK.emoji, set: PICK.set, thumb: PICK.thumb,
      audio, filename: FILE.name, mime: FILE.type || "audio/mpeg",
    });
    delete URLS[r.item.id];
    ITEMS = [r.item, ...ITEMS.filter((x) => x.id !== r.item.id)];
    renderLists();
    show("mine");
    note("#ok", "Готово! Звук добавлен. Бот прислал его тебе в личку для проверки.", 5000);
  } catch (e) { fail(e); }
  $("#up-t").textContent = "Загрузить";
  updateUpload();
};

/* ---------- окошко со стикером ---------- */
let CUR = null;
async function openSticker(it) {
  CUR = it;
  $("#m-title").textContent = it.set || "Стикер";
  $("#m-sub").textContent = `Добавил: ${it.ownerName}${it.mine ? " (ты)" : ""}`;
  const pic = $("#m-pic");
  $("#modal").hidden = false;
  let thumb = it.thumb || "";
  if (!thumb) {
    pic.replaceChildren(ico("loader"));
    pic.classList.add("spin");
    try {
      thumb = (await api("sticker", { id: it.id })).thumb || "";
      if (thumb) it.thumb = thumb;
    } catch (e) { fail(e); }
    pic.classList.remove("spin");
    if (CUR !== it) return;
  }
  if (thumb) {
    const img = el("img");
    img.alt = "";
    img.src = "/.netlify/functions/sticker-img?f=" + encodeURIComponent(thumb);
    pic.replaceChildren(img);
  } else {
    pic.replaceChildren(ico("sticker"));
    $("#m-sub").textContent += ". Картинка недоступна: звук добавлен без привязки к набору.";
  }
}
function closeModal() {
  $("#modal").hidden = true;
  stopAudio();
  CUR = null;
}
$("#modal-x").onclick = closeModal;
$("#modal").onclick = (e) => { if (e.target === $("#modal")) closeModal(); };
$("#m-play").onclick = () => CUR && togglePlay(CUR.id, $("#m-play"));
$("#m-del").onclick = () => CUR && askDelete(CUR, closeModal);

/* ---------- запуск ---------- */
tg?.BackButton.onClick(back);
document.querySelectorAll("[data-back]").forEach((b) => (b.onclick = back));
$("#go-mine").onclick = () => show("mine");
$("#go-add").onclick = openAdd;
$("#go-admin").onclick = () => INFO?.isAdmin && show("admin");

$("#go-schedule").onclick = () => {
  if (!INFO?.appLink) return fail(new Error("Не задана ссылка на расписание (APP_LINK)"));
  if (tg) {
    tg.openTelegramLink(INFO.appLink);
    setTimeout(() => tg.close(), 400);
  } else location.href = INFO.appLink;
};

api("info")
  .then(async (j) => {
    INFO = j;
    $("#hi").textContent = j.name ? `Привет, ${j.name}!` : "Привет!";
    $("#go-admin").hidden = !j.isAdmin;
    await refresh();
  })
  .catch((e) => { $("#hi").textContent = ""; fail(e); });
</script>
</body>
</html>
