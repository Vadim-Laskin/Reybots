[build]
  publish = "netlify/public"
  functions = "netlify/functions"

[functions]
  included_files = ["fonts/**"]
  external_node_modules = ["@resvg/resvg-js"]

[functions."schedule"]
  schedule = "45 10 * * *"

[functions."watch"]
  schedule = "*/15 * * * *"

[functions."homework"]
  schedule = "1 11 * * *"

[functions."birthday"]
  schedule = "0 2 * * *"

[functions."newyear"]
  schedule = "0 17 31 12 *"
