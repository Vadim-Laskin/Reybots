org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Адрес сайта на Netlify, который открывает приложение (без слэша в конце).
# ЗАМЕНИ на свой. Чтобы не менять файл в репозитории, можно задать reyBaseUrl
# в ~/.gradle/gradle.properties — он имеет приоритет.
reyBaseUrl=https://YOUR-SITE.netlify.app
