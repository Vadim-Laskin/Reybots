<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/festive.js" defer></script>
<style>
:root{--bg:#0e1014;--card:#1a1d26;--redbg:#2a1a20;--accent:#8b7bff;--red:#ff5d6c;--green:#4ade80;--text:#eceef5;--muted:#8b90a0;--line:#2a2e3a}
*{box-sizing:border-box;margin:0}
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea,[contenteditable],.ai-msgs,.ai-msgs *,.sel,.sel *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 12px) 16px 6px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:24px}
.top{gap:8px}.top h1{flex:1}#lk{background:var(--card);color:var(--text);border:0;border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;padding:0}
#refresh{background:var(--card);color:var(--text);border:0;border-radius:12px;width:40px;height:40px;font-size:20px}
#upd{font-size:12px;color:var(--muted);margin-top:2px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-width:52px;padding:8px 10px;border-radius:14px;background:var(--card);color:var(--muted);text-align:center;font-size:12px}
.tab b{display:block;font-size:18px;color:var(--text)}
.tab.today{outline:1.5px solid var(--accent)}
.tab.active{background:var(--accent);color:#fff}
.tab.active b{color:#fff}
main{padding:0 16px}
.day h2{font-size:18px;margin:18px 0 10px;color:var(--accent)}
.empty{background:var(--card);border-radius:18px;padding:18px;color:var(--green);font-weight:700}
.pair{display:flex;gap:14px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.pair.cancel{background:var(--redbg)}
.pair.past{opacity:.4}
.entry.other{opacity:.4}
.bdw{position:fixed;left:12px;right:12px;bottom:calc(var(--bot,24px) + 8px);z-index:85;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px 14px 14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translateY(calc(100% + 60px));opacity:0;transition:transform .42s cubic-bezier(.2,.85,.25,1),opacity .3s ease}
.bdw.open{transform:none;opacity:1}
.bdw[hidden]{display:none}
.bdw b{display:block;font-size:16px;margin-bottom:4px;padding-right:26px}
.bdw span{display:block;font-size:13.5px;color:var(--muted);line-height:1.4}
.bdw .row{display:flex;gap:8px;margin-top:12px}
.bdw .row button{flex:1;border:0;border-radius:13px;padding:12px 8px;font:inherit;font-weight:700;background:var(--accent);color:#fff}
.bdw .row button.g{background:var(--line);color:var(--text)}
.bdw .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:0}
.ntw{position:fixed;inset:0;z-index:90}
.ntw[hidden]{display:none}
.ntb{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s ease}
.nts{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;border-top:1.5px solid var(--line);padding:12px 18px calc(var(--bot,24px) + 14px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.85,.25,1)}
.ntw.open .ntb{opacity:1}
.ntw.open .nts{transform:none}
.nts .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.nts b{display:block;font-size:19px;margin-bottom:6px}
.nts span{display:block;font-size:14px;color:var(--muted);line-height:1.4}
.nts .row{display:flex;gap:10px;margin-top:20px}
.nts .row[hidden]{display:none}
.nts .row button{flex:1;border:0;border-radius:16px;padding:15px 10px;font:inherit;font-weight:700;background:var(--accent);color:#fff}
.nts .row button.g{background:var(--line);color:var(--text)}
.pair.now{outline:2px solid var(--green)}
.pair.next{outline:1.5px dashed var(--accent)}
.num{width:54px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.num b{display:block;font-size:30px;color:var(--accent)}
.cancel .num b{color:var(--red)}
.num span{display:block;font-size:12px;color:var(--muted)}
.info{flex:1;min-width:0}
.entry+.entry{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sg{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.s{font-weight:700;font-size:16px}
.s.red{color:var(--red)}
.t{font-size:14px;color:var(--muted);margin-top:2px}
.r{font-size:14px;margin-top:2px}
.badge{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:var(--green)}
.badge.soft{color:var(--accent)}
.st .badge{display:block}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:2px}
#msg{padding:40px 16px;text-align:center;color:var(--muted)}
#warn{display:none;align-items:flex-start;gap:8px;margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--redbg);color:var(--red);font-size:13px;line-height:1.35}
#warn svg{flex:none;width:18px;height:18px}
/* ---------- анимации ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spinr{to{transform:rotate(360deg)}}
body.first #list>*{animation:rise .4s cubic-bezier(.2,.8,.25,1) backwards}
body.first #list>*:nth-child(2){animation-delay:.05s}body.first #list>*:nth-child(3){animation-delay:.1s}body.first #list>*:nth-child(4){animation-delay:.15s}body.first #list>*:nth-child(5){animation-delay:.2s}
#refresh,#lk{transition:transform .15s ease,background-color .2s}
#refresh:active,#lk:active{transform:scale(.92)}
#refresh.spin svg{animation:spinr .8s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Расписание</h1><button id="lk" aria-label="Личный кабинет"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button><button id="refresh" aria-label="Обновить"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button></div>
  <div id="upd"></div>
  <div id="warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></svg><span id="warn-t"></span></div>
  <div id="tabs"></div>
</header>
<script>document.body.classList.add("first");setTimeout(function(){document.body.classList.remove("first")},1500)</script>
<main id="list"><div id="msg">Загрузка…</div></main>

<div class="bdw" id="bdn" hidden>
  <button class="x" id="bdn-x" aria-label="Скрыть">×</button>
  <b>Укажи дату рождения 🎂</b>
  <span>Добавь её в личном кабинете, и тебя поздравят в этот день.</span>
  <div class="row"><button id="bdn-go">В кабинет</button><button class="g" id="bdn-hide">Скрыть</button></div>
</div>
<div class="ntw" id="nt" hidden>
  <div class="ntb" id="nt-bg"></div>
  <div class="nts">
    <div class="grab"></div>
    <b>Уведомления об изменениях пар</b>
    <span>Хочешь, чтобы бот писал тебе, когда преподаватель отменит пару или отпустит раньше?</span>
    <div class="row" id="nt-main"><button id="nt-yes">Да</button><button class="g" id="nt-no">Нет</button></div>
    <div class="row" id="nt-more" hidden><button class="g" id="nt-never">Не показывать больше</button><button class="g" id="nt-hide">Скрыть сейчас</button></div>
  </div>
</div>
<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.("#0e1014");
  tg.setBackgroundColor?.("#0e1014");
  tg.disableVerticalSwipes?.();
  try { if (tg.isVersionAtLeast?.("8.0")) tg.requestFullscreen?.(); } catch {}
}

const WD = { Понедельник:"Пн", Вторник:"Вт", Среда:"Ср", Четверг:"Чт", Пятница:"Пт", Суббота:"Сб", Воскресенье:"Вс" };
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const toMin = (s) => { const [a, b] = s.split(":").map(Number); return a * 60 + b; };
const fmt = (m) => (m < 60 ? `${m} мин` : `${Math.floor(m / 60)} ч ${m % 60} мин`);
const Q = new URLSearchParams(location.search);
function nskNow() {
  const d = new Date(Date.now() + 7 * 3600e3);
  if (Q.get("t")) {
    return { date: Q.get("d") || d.toISOString().slice(0, 10), min: toMin(Q.get("t")) };
  }
  return { date: d.toISOString().slice(0, 10), min: d.getUTCHours() * 60 + d.getUTCMinutes() };
}

let DATA = null, lastCur = null, MYSG = 0, NOTIF = null;
// подгруппа пользователя (из кабинета); если не открыто из Telegram — не используем
let ntSkip = false; // закрыли касанием мимо кнопок: только до следующего открытия
const ntHidden = () => ntSkip || (() => { try { return sessionStorage.getItem("nt-hide") === "1"; } catch { return false; } })();
function ntShow(on) {
  const w = $("#nt");
  if (on) {
    if (!w.hidden) return;
    w.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add("open")));
  } else {
    if (w.hidden) return;
    w.classList.remove("open");
    setTimeout(() => { if (!w.classList.contains("open")) { w.hidden = true; $("#nt-more").hidden = true; $("#nt-main").hidden = false; } }, 400);
  }
}
document.body.append($("#nt"));
$("#nt-bg").onclick = () => { ntSkip = true; renderNt(); };
let BDV = null; // дата рождения из кабинета: "" — не указана, null — ещё не знаем
const BDN_KEY = "bd-hide", BDN_DAYS = 7;
const bdnHidden = () => { try { return Date.now() - Number(localStorage.getItem(BDN_KEY) || 0) < BDN_DAYS * 864e5; } catch { return false; } };
let bdnSkip = false;
function bdnShow(on) {
  const w = $("#bdn");
  if (on) {
    if (!w.hidden) return;
    w.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add("open")));
  } else {
    if (w.hidden) return;
    w.classList.remove("open");
    setTimeout(() => { if (!w.classList.contains("open")) w.hidden = true; }, 450);
  }
}
// не показываем, пока на экране вопрос про уведомления
function renderBdn() {
  const on = BDV === "" && !bdnHidden() && !bdnSkip && (NOTIF !== 0 || ntHidden());
  if (on) setTimeout(() => { if (BDV === "" && !bdnHidden() && !bdnSkip) bdnShow(true); }, 900); else bdnShow(false);
}
function bdnClose() { bdnSkip = true; try { localStorage.setItem(BDN_KEY, String(Date.now())); } catch {} bdnShow(false); }
$("#bdn-x").onclick = bdnClose;
$("#bdn-hide").onclick = bdnClose;
$("#bdn-go").onclick = () => { bdnShow(false); setTimeout(() => location.replace("/cabinet/"), 300); };
function renderNt() {
  renderBdn(); const on = NOTIF === 0 && !ntHidden(); if (on) setTimeout(() => ntShow(true), 500); else ntShow(false); }
async function ntSet(v) {
  try {
    const r = await fetch("/.netlify/functions/cabinet", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "notif_set", value: v, initData: tg.initData }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    NOTIF = v; renderNt(); setTimeout(renderBdn, 500);
  } catch (e) { alert("Не получилось сохранить: " + e.message); }
}
$("#nt-yes").onclick = () => ntSet(1);
$("#nt-no").onclick = () => { $("#nt-main").hidden = true; $("#nt-more").hidden = false; };
$("#nt-never").onclick = () => ntSet(-1);
$("#nt-hide").onclick = () => { try { sessionStorage.setItem("nt-hide", "1"); } catch {} renderNt(); };
async function loadMySg() {
  if (!tg?.initData) return;
  try {
    const r = await fetch("/.netlify/functions/cabinet", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "info", initData: tg.initData }) });
    if (!r.ok) return;
    const j = await r.json();
    if (j.blocked) return; // не из группы: расписание открыто, а про уведомления и ДР не спрашиваем
    NOTIF = Number(j.notif) || 0;
    BDV = j.bd || "";
    renderNt();
    const g = Number(j.sg) || 0;
    if (g !== MYSG) { MYSG = g; if (DATA) build(); }
  } catch {}
}
// правки админа для «Идёт / следующая»: отмена пары или «отпустили раньше»
const ovOf = (date, num, sg) => ((DATA?.over?.[date] || {})[num] || []).find((o) => (o.sg || 0) === sg);

function build() {
  const tabs = $("#tabs"), list = $("#list");
  tabs.replaceChildren();
  list.replaceChildren();
  $("#upd").textContent = DATA.updated ? `Обновлено на сайте: ${DATA.updated}` : "";
  const warn = $("#warn");
if (DATA.stale) {
  const d = new Date((DATA.fetchedAt || 0) + 7 * 3600e3);
  const p = (n) => String(n).padStart(2, "0");
  $("#warn-t").textContent =
    `Сайт natk.ru недоступен, поэтому расписание не обновляется автоматически, пока он не восстановится. ` +
    `Показано сохранённое: ${p(d.getUTCDate())}.${p(d.getUTCMonth() + 1)} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} (НСК).`;
  warn.style.display = "flex";
} else warn.style.display = "none";
  for (const d of DATA.days) {
    const tab = el("div", "tab");
    tab.dataset.date = d.date;
    tab.append(el("span", null, WD[d.weekday] || d.weekday.slice(0, 2)), el("b", null, String(+d.date.slice(8))));
    tab.onclick = () => jump(d.date, true);
    tabs.append(tab);

    const sec = el("section", "day");
    sec.id = "d-" + d.date;
    const title = el("h2", null, `${d.label}, ${d.weekday.toLowerCase()}`);
    title.dataset.date = d.date;
    sec.append(title);
    if (d.empty) sec.append(el("div", "empty", "Занятий нет"));

    for (const p of d.pairs) {
      const allCancel = p.entries.every((e) => e.cancelled);
      const c = el("div", "pair" + (allCancel ? " cancel" : ""));
      c.dataset.date = d.date;
      c.dataset.start = p.start;
      c.dataset.end = p.end;
      c.dataset.cancel = allCancel ? "1" : "";
      c.dataset.num = p.num;
      // пара только для другой подгруппы — показываем как прошедшую
      c.dataset.other = MYSG && p.entries.length && p.entries.every((e) => e.sg && e.sg !== MYSG) ? "1" : "";
      const num = el("div", "num");
      num.append(el("b", null, p.num), el("span", null, p.start), el("span", null, p.end));
      const info = el("div", "info");
      p.entries.forEach((e, i) => {
        const b = el("div", "entry" + (MYSG && e.sg && e.sg !== MYSG ? " other" : ""));
        const lab = e.sg ? `${e.sg} подгруппа` : p.sub ? "по подгруппам" : "";
        if (lab) b.append(el("div", "sg", lab));
        b.append(el("div", e.cancelled ? "s red" : "s", e.subject));
        if (e.teacher) b.append(el("div", "t", e.teacher));
        if (e.room) b.append(el("div", "r", e.room));
        info.append(b);
      });
      info.append(el("div", "st"));
      c.append(num, info);
      sec.append(c);
    }
    list.append(sec);
  }
  tick();
  onScroll();
}

function tick() {
  if (!DATA) return;
  const now = nskNow();
  let nextMarked = false;
  document.querySelectorAll(".pair").forEach((c) => {
    const st = c.querySelector(".st");
    st.replaceChildren();
    c.classList.remove("now", "past", "next");
    const date = c.dataset.date, s = toMin(c.dataset.start), num = c.dataset.num;
    let e = toMin(c.dataset.end), cancel = c.dataset.cancel;
    const notes = [];
    const all = ovOf(date, num, 0);
    if (all && all.t === "cancel") { cancel = "1"; notes.push("Пару отменили"); }
    else if (all && all.t === "early" && toMin(all.end) > s && toMin(all.end) < e) { e = toMin(all.end); notes.push(`Отпустили раньше: до ${all.end}`); }
    else if (all && all.t === "early") { cancel = "1"; notes.push("Пару отменили"); }
    [1, 2].forEach((g) => {
      const o = ovOf(date, num, g);
      if (o) notes.push(`${g} подгр.: ${o.t === "cancel" ? "пару отменили" : "отпустили до " + o.end}`);
    });
    const state = c.dataset.other ? "past" :
      date < now.date ? "past" : date > now.date ? "future" :
      now.min >= e ? "past" : now.min >= s ? "now" : "future";
    if (state === "past") c.classList.add("past");
    else if (state === "now" && !cancel) {
      c.classList.add("now");
      st.append(el("div", "badge", `Идёт сейчас · осталось ${e - now.min} мин`));
      const bar = el("div", "bar"), i = el("i");
      i.style.width = Math.round(((now.min - s) / (e - s)) * 100) + "%";
      bar.append(i);
      st.append(bar);
    } else if (state === "future" && !cancel && date === now.date && !nextMarked) {
      nextMarked = true;
      c.classList.add("next");
      st.append(el("div", "badge soft", `Следующая · через ${fmt(s - now.min)}`));
    }
    // пометки админа показываем у всех непрошедших пар
    if (state !== "past") notes.forEach((t) => st.append(el("div", "badge soft", t)));
  });
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("today", t.dataset.date === now.date));
}

function jump(date, smooth) {
  const sec = document.getElementById("d-" + date);
  if (!sec) return;
  const top = sec.getBoundingClientRect().top + window.scrollY - $("header").offsetHeight - 4;
  window.scrollTo({ top, behavior: smooth ? "smooth" : "auto" });
}

function onScroll() {
  if (!DATA || !DATA.days.length) return;
  const hh = $("header").offsetHeight;
  let cur = DATA.days[0].date;
  document.querySelectorAll(".day h2").forEach((t) => {
    if (t.getBoundingClientRect().top <= hh + 8) cur = t.dataset.date;
  });
  if (cur === lastCur) return;
  lastCur = cur;
  document.querySelectorAll(".tab").forEach((t) => {
    const a = t.dataset.date === cur;
    t.classList.toggle("active", a);
    if (a) t.scrollIntoView({ inline: "center", block: "nearest" });
  });
}

let first = true;
async function load() {
  try {
    const r = await fetch("/.netlify/functions/schedule-data", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    if (Q.has("stale")) { DATA.stale = true; DATA.fetchedAt = Date.now() - 3600e3; }
    if (!DATA.days || !DATA.days.length) throw new Error("расписание пустое");
    const y = window.scrollY;
    build();
    if (first) {
      first = false;
      const today = nskNow().date;
      const d = DATA.days.find((x) => x.date >= today) || DATA.days[0];
      jump(d.date, false);
    } else window.scrollTo(0, y);
  } catch (e) {
    if (!DATA) {
  const m = el("div", null, "Не удалось загрузить: " + e.message);
  m.id = "msg";
  $("#list").replaceChildren(m);
}
  }
}

$("#refresh").onclick = load;
$("#lk").onclick = () => { location.replace("/cabinet/"); };
window.addEventListener("scroll", onScroll, { passive: true });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); load(); loadMySg(); } });
setInterval(tick, 30000);
setInterval(load, 5 * 60000);
loadMySg();
load();
</script>
</body>
</html>
