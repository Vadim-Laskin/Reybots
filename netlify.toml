[build]
  publish = "netlify/public"
  functions = "netlify/functions"

[functions]
  included_files = ["fonts/**", "assets/**"]
  external_node_modules = ["@resvg/resvg-js"]

[functions."schedule"]
  schedule = "0 11 * * *"

# 00:00 по Новосибирску (17:00 UTC): «Завтра» в сообщениях меняется на «Сегодня»; повторы через 15 минут на случай сбоя
[functions."midnight"]
  schedule = "*/15 17 * * *"

[functions."watch"]
  schedule = "*/15 * * * *"

[functions."homework"]
  schedule = "0 11 * * *"

[functions."birthday"]
  schedule = "0 2 * * *"

[functions."newyear"]
  schedule = "0 17 31 12 *"
