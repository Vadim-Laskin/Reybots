<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e1014;--card:#1a1d26;--redbg:#2a1a20;--accent:#8b7bff;--red:#ff5d6c;--green:#4ade80;--text:#eceef5;--muted:#8b90a0;--line:#2a2e3a}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 12px) 16px 6px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:24px}
#refresh{background:var(--card);color:var(--text);border:0;border-radius:12px;width:40px;height:40px;font-size:20px}
#upd{font-size:12px;color:var(--muted);margin-top:2px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-width:52px;padding:8px 10px;border-radius:14px;background:var(--card);color:var(--muted);text-align:center;font-size:12px}
.tab b{display:block;font-size:18px;color:var(--text)}
.tab.today{outline:1.5px solid var(--accent)}
.tab.active{background:var(--accent);color:#fff}
.tab.active b{color:#fff}
main{padding:0 16px}
.day h2{font-size:18px;margin:18px 0 10px;color:var(--accent);text-transform:capitalize}
.empty{background:var(--card);border-radius:18px;padding:18px;color:var(--green);font-weight:700}
.pair{display:flex;gap:14px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.pair.cancel{background:var(--redbg)}
.pair.past{opacity:.4}
.pair.now{outline:2px solid var(--green)}
.pair.next{outline:1.5px dashed var(--accent)}
.num{width:54px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.num b{display:block;font-size:30px;color:var(--accent)}
.cancel .num b{color:var(--red)}
.num span{display:block;font-size:12px;color:var(--muted)}
.info{flex:1;min-width:0}
.entry+.entry{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sg{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.s{font-weight:700;font-size:16px}
.s.red{color:var(--red)}
.t{font-size:14px;color:var(--muted);margin-top:2px}
.r{font-size:14px;margin-top:2px}
.badge{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:var(--green)}
.badge.soft{color:var(--accent)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:2px}
#msg{padding:40px 16px;text-align:center;color:var(--muted)}
#warn{display:none;margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--redbg);color:var(--red);font-size:13px;line-height:1.35}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Расписание</h1><button id="refresh" aria-label="Обновить">↻</button></div>
  <div id="upd"></div>
  <div id="warn"></div>
  <div id="tabs"></div>
</header>
<main id="list"><div id="msg">Загрузка…</div></main>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.("#0e1014");
  tg.setBackgroundColor?.("#0e1014");
  tg.disableVerticalSwipes?.();
  try { if (tg.isVersionAtLeast?.("8.0")) tg.requestFullscreen?.(); } catch {}
}

const WD = { Понедельник:"Пн", Вторник:"Вт", Среда:"Ср", Четверг:"Чт", Пятница:"Пт", Суббота:"Сб", Воскресенье:"Вс" };
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const toMin = (s) => { const [a, b] = s.split(":").map(Number); return a * 60 + b; };
const fmt = (m) => (m < 60 ? `${m} мин` : `${Math.floor(m / 60)} ч ${m % 60} мин`);
function nskNow() {
  const d = new Date(Date.now() + 7 * 3600e3);
  return { date: d.toISOString().slice(0, 10), min: d.getUTCHours() * 60 + d.getUTCMinutes() };
}

let DATA = null, lastCur = null;

function build() {
  const tabs = $("#tabs"), list = $("#list");
  tabs.replaceChildren();
  list.replaceChildren();
  $("#upd").textContent = DATA.updated ? `Обновлено на сайте: ${DATA.updated}` : "";
  const warn = $("#warn");
if (DATA.stale) {
  const d = new Date((DATA.fetchedAt || 0) + 7 * 3600e3);
  const p = (n) => String(n).padStart(2, "0");
  warn.textContent =
    `⚠️ Сайт natk.ru недоступен, поэтому расписание не обновляется автоматически, пока он не восстановится. ` +
    `Показано сохранённое: ${p(d.getUTCDate())}.${p(d.getUTCMonth() + 1)} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} (НСК).`;
  warn.style.display = "block";
} else warn.style.display = "none";
  for (const d of DATA.days) {
    const tab = el("div", "tab");
    tab.dataset.date = d.date;
    tab.append(el("span", null, WD[d.weekday] || d.weekday.slice(0, 2)), el("b", null, String(+d.date.slice(8))));
    tab.onclick = () => jump(d.date, true);
    tabs.append(tab);

    const sec = el("section", "day");
    sec.id = "d-" + d.date;
    const title = el("h2", null, `${d.label}, ${d.weekday.toLowerCase()}`);
    title.dataset.date = d.date;
    sec.append(title);
    if (d.empty) sec.append(el("div", "empty", "Занятий нет"));

    for (const p of d.pairs) {
      const allCancel = p.entries.every((e) => e.cancelled);
      const c = el("div", "pair" + (allCancel ? " cancel" : ""));
      c.dataset.date = d.date;
      c.dataset.start = p.start;
      c.dataset.end = p.end;
      c.dataset.cancel = allCancel ? "1" : "";
      const num = el("div", "num");
      num.append(el("b", null, p.num), el("span", null, p.start), el("span", null, p.end));
      const info = el("div", "info");
      p.entries.forEach((e, i) => {
        const b = el("div", "entry");
        const lab = e.sg ? `${e.sg} подгруппа` : p.sub ? "по подгруппам" : "";
        if (lab) b.append(el("div", "sg", lab));
        b.append(el("div", e.cancelled ? "s red" : "s", e.subject));
        if (e.teacher) b.append(el("div", "t", e.teacher));
        if (e.room) b.append(el("div", "r", e.room));
        info.append(b);
      });
      info.append(el("div", "st"));
      c.append(num, info);
      sec.append(c);
    }
    list.append(sec);
  }
  tick();
  onScroll();
}

function tick() {
  if (!DATA) return;
  const now = nskNow();
  let nextMarked = false;
  document.querySelectorAll(".pair").forEach((c) => {
    const st = c.querySelector(".st");
    st.replaceChildren();
    c.classList.remove("now", "past", "next");
    const date = c.dataset.date, s = toMin(c.dataset.start), e = toMin(c.dataset.end), cancel = c.dataset.cancel;
    const state =
      date < now.date ? "past" : date > now.date ? "future" :
      now.min >= e ? "past" : now.min >= s ? "now" : "future";
    if (state === "past") c.classList.add("past");
    else if (state === "now" && !cancel) {
      c.classList.add("now");
      st.append(el("div", "badge", `Идёт сейчас · осталось ${e - now.min} мин`));
      const bar = el("div", "bar"), i = el("i");
      i.style.width = Math.round(((now.min - s) / (e - s)) * 100) + "%";
      bar.append(i);
      st.append(bar);
    } else if (state === "future" && !cancel && date === now.date && !nextMarked) {
      nextMarked = true;
      c.classList.add("next");
      st.append(el("div", "badge soft", `Следующая · через ${fmt(s - now.min)}`));
    }
  });
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("today", t.dataset.date === now.date));
}

function jump(date, smooth) {
  const sec = document.getElementById("d-" + date);
  if (!sec) return;
  const top = sec.getBoundingClientRect().top + window.scrollY - $("header").offsetHeight - 4;
  window.scrollTo({ top, behavior: smooth ? "smooth" : "auto" });
}

function onScroll() {
  if (!DATA || !DATA.days.length) return;
  const hh = $("header").offsetHeight;
  let cur = DATA.days[0].date;
  document.querySelectorAll(".day h2").forEach((t) => {
    if (t.getBoundingClientRect().top <= hh + 8) cur = t.dataset.date;
  });
  if (cur === lastCur) return;
  lastCur = cur;
  document.querySelectorAll(".tab").forEach((t) => {
    const a = t.dataset.date === cur;
    t.classList.toggle("active", a);
    if (a) t.scrollIntoView({ inline: "center", block: "nearest" });
  });
}

let first = true;
async function load() {
  try {
    const r = await fetch("/.netlify/functions/schedule-data", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    if (!DATA.days || !DATA.days.length) throw new Error("расписание пустое");
    const y = window.scrollY;
    build();
    if (first) {
      first = false;
      const today = nskNow().date;
      const d = DATA.days.find((x) => x.date >= today) || DATA.days[0];
      jump(d.date, false);
    } else window.scrollTo(0, y);
  } catch (e) {
    if (!DATA) {
  const m = el("div", null, "Не удалось загрузить: " + e.message);
  m.id = "msg";
  $("#list").replaceChildren(m);
}
  }
}

$("#refresh").onclick = load;
window.addEventListener("scroll", onScroll, { passive: true });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); load(); } });
setInterval(tick, 30000);
setInterval(load, 5 * 60000);
load();
</script>
</body>
</html>
